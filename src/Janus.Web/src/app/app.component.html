<div class="app-shell" [class.sidebar-open]="sidebarOpen()">
  <!-- Voile d'arrière-plan sur mobile -->
  <div
    class="sidebar-backdrop"
    [class.visible]="sidebarOpen()"
    (click)="closeSidebar()"
    aria-hidden="true">
  </div>

  <!-- Barre latérale de navigation -->
  <app-sidebar [isOpen]="sidebarOpen()" (closeSidebar)="closeSidebar()"></app-sidebar>

  <!-- Zone principale -->
  <div class="app-main">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <main class="page-content" id="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="app-footer">
      <div class="footer-meta">
        <span class="footer-title">Janus RFID Platform</span>
        <span class="sep">•</span>
        <span>Système de Billettique Virtuelle & Sécurisée</span>
        <span class="sep">•</span>
        <span class="footer-author">Nacef Moula (ESPRIT)</span>
      </div>
      <div class="footer-badges">
        <span class="tech-pill">ASP.NET Core 10</span>
        <span class="tech-pill">PostgreSQL 18</span>
        <span class="tech-pill">Angular 19</span>
        <span class="tech-pill">OpenTelemetry</span>
      </div>
    </footer>
  </div>
</div>

<app-toast></app-toast>
