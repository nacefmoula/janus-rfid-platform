server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression Gzip pour les bundles statiques
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Routage Single Page Application (SPA Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Résolveur DNS interne Docker (résolution dynamique à la requête, évite crash au démarrage si api non résolu)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://api:8080;

    # Proxy transparent vers l'API Janus (écrase X-Forwarded-For avec $remote_addr pour bloquer toute usurpation amont)
    location /api/ {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
