services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus_db}
      POSTGRES_USER: ${POSTGRES_USER:-janus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-db-password-change-me}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-janus_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-local-dev-runtime-password-change-me}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - janus_postgres_data:/var/lib/postgresql
      - ./scripts/init-postgres-least-privilege.sh:/docker-entrypoint-initdb.d/01-init-postgres-least-privilege.sh:ro
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  api:
    build: ./src/Janus.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__JanusDb: Host=db;Port=5432;Database=${POSTGRES_DB:-janus_db};Username=${POSTGRES_RUNTIME_USER:-janus_runtime};Password=${POSTGRES_RUNTIME_PASSWORD:-local-dev-runtime-password-change-me}
      ConnectionStrings__MigrationDb: Host=db;Port=5432;Database=${POSTGRES_DB:-janus_db};Username=${POSTGRES_USER:-janus_app};Password=${POSTGRES_PASSWORD:-local-dev-db-password-change-me}
      TerminalAuth__DemoToken: ${TERMINAL_DEMO_TOKEN:-dev-terminal-token-change-me}
      AdminAuth__DemoToken: ${ADMIN_DEMO_TOKEN:-dev-admin-token-change-me}
      MetricsAuth__ScrapeToken: ${METRICS_SCRAPE_TOKEN:-dev-metrics-scrape-token-change-me}
      Fare__AmountMillimes: ${FARE_AMOUNT_MILLIMES:-1500}
      AntiPassback__Enabled: ${ANTIPASSBACK_ENABLED:-true}
      AntiPassback__WindowSeconds: ${ANTIPASSBACK_WINDOW_SECONDS:-30}
      TerminalAuth__Terminal2Token: ${TERMINAL_02_TOKEN:-dev-terminal-02-token-change-me}
      RateLimiting__ValidationsPermitLimit: ${VALIDATIONS_PERMIT_LIMIT:-30}
      RateLimiting__AdminPermitLimit: ${ADMIN_PERMIT_LIMIT:-15}
      RateLimiting__CardsReadPermitLimit: ${CARDS_READ_PERMIT_LIMIT:-60}
      RateLimiting__AnonymousPermitLimit: ${ANONYMOUS_PERMIT_LIMIT:-30}
      ReverseProxy__TrustedProxies: ${TRUSTED_PROXIES:-172.28.0.10}
      ReverseProxy__TrustedNetworks: ${TRUSTED_NETWORKS:-}
    ports: ["127.0.0.1:5080:8080"]
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr => \"127.0.0.1\", PeerPort => 8080, Proto => \"tcp\", Timeout => 2) or exit 1; print $$s \"GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\"; my $$l = <$$s>; exit($$l =~ /200/ ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: janus-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - janus_prometheus_data:/prometheus
    secrets:
      - metrics_token
    ports: ["127.0.0.1:9090:9090"]
    networks:
      - frontend_net
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: janus-grafana
    restart: unless-stopped
    environment:
      # Sécurité locale/démo : accès lié à 127.0.0.1:3000 et accès anonyme désactivé par défaut (GRAFANA_ANONYMOUS_ENABLED=false).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-password-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - janus_grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks:
      - frontend_net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  web:
    build: ./src/Janus.Web
    container_name: janus-web
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-4280}:8080"]
    networks:
      frontend_net:
        ipv4_address: 172.28.0.10
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

networks:
  frontend_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend_net:
    driver: bridge

secrets:
  metrics_token:
    environment: METRICS_SCRAPE_TOKEN

volumes:
  janus_postgres_data:
  janus_prometheus_data:
  janus_grafana_data:
