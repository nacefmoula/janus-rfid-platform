services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus_db}
      POSTGRES_USER: ${POSTGRES_USER:-janus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-db-password-change-me}
    ports: ["5433:5432"]
    volumes: ["janus_postgres_data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./src/Janus.Api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__JanusDb: Host=db;Port=5432;Database=${POSTGRES_DB:-janus_db};Username=${POSTGRES_USER:-janus_app};Password=${POSTGRES_PASSWORD:-local-dev-db-password-change-me}
      TerminalAuth__DemoToken: ${TERMINAL_DEMO_TOKEN:-dev-terminal-token-change-me}
      AdminAuth__DemoToken: ${ADMIN_DEMO_TOKEN:-dev-admin-token-change-me}
      Fare__AmountMillimes: ${FARE_AMOUNT_MILLIMES:-1500}
    ports: ["5080:8080"]
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: janus-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - janus_prometheus_data:/prometheus
    ports: ["9090:9090"]
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: janus-grafana
    environment:
      # Sécurité locale/démo : mot de passe et accès anonyme paramétrables par variables d'environnement.
      # En environnement de production : définir des mots de passe robustes et désactiver l'accès anonyme (GRAFANA_ANONYMOUS_ENABLED=false).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-password-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - janus_grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      - prometheus

  web:
    build: ./src/Janus.Web
    container_name: janus-web
    ports: ["${FRONTEND_PORT:-4280}:80"]
    depends_on:
      - api

volumes:
  janus_postgres_data:
  janus_prometheus_data:
  janus_grafana_data:
