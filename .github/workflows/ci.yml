name: CI / DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-dotnet:
    name: 1. Build .NET 10 (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies
        run: dotnet restore

      - name: Compile API and Tests in Release configuration
        run: dotnet build --configuration Release --no-restore

  test-and-build-frontend:
    name: 2. Frontend Angular (Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/Janus.Web/package-lock.json'

      - name: Install dependencies
        working-directory: src/Janus.Web
        run: npm ci

      - name: Run Angular unit tests (Karma / Headless Chrome) with code coverage
        working-directory: src/Janus.Web
        run: |
          npm test -- --watch=false --code-coverage
          sed -i 's|^SF:src/|SF:src/Janus.Web/src/|' coverage/janus.web/lcov.info

      - name: Upload frontend code coverage artifact (LCOV)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: frontend-coverage
          path: src/Janus.Web/coverage/janus.web/lcov.info
          if-no-files-found: error

      - name: Build Angular production bundle
        working-directory: src/Janus.Web
        run: npm run build -- --configuration production

  integration-tests:
    name: 3. Integration Tests & E2E Validation
    runs-on: ubuntu-latest
    needs: [build-dotnet, test-and-build-frontend]

    env:
      POSTGRES_DB: janus_ci_db
      POSTGRES_USER: janus_ci_user
      POSTGRES_PASSWORD: ci_test_password_secure_99
      TERMINAL_DEMO_TOKEN: ci_terminal_token_secure_99
      TERMINAL_02_TOKEN: ci_terminal_02_token_secure_99
      ADMIN_DEMO_TOKEN: ci_admin_token_secure_99
      FARE_AMOUNT_MILLIMES: 1500
      ANTIPASSBACK_ENABLED: "true"
      ANTIPASSBACK_WINDOW_SECONDS: "30"
      JANUS_BASE_URL: http://localhost:5080

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Start isolated services (Docker Compose)
        run: |
          docker compose up --build -d

      - name: Wait for Janus API availability
        run: |
          echo "Attente de la disponibilité de l'API Janus sur $JANUS_BASE_URL/health..."
          for i in {1..30}; do
            if curl -sf "$JANUS_BASE_URL/health" > /dev/null 2>&1; then
              echo "✔ API Janus opérationnelle !"
              curl -s "$JANUS_BASE_URL/health"
              echo ""
              exit 0
            fi
            echo "Attente du démarrage du service... tentative $i/30"
            sleep 2
          done
          echo "❌ L'API n'a pas répondu dans le délai imparti."
          docker compose logs
          exit 1

      - name: Verify Observability Stack (Prometheus & Grafana)
        run: |
          echo "Attente de la disponibilité de Prometheus sur http://localhost:9090/-/healthy..."
          prom_ready=false
          for i in {1..20}; do
            if curl -sf "http://localhost:9090/-/healthy" > /dev/null 2>&1; then
              echo "✔ Prometheus opérationnel !"
              prom_ready=true
              break
            fi
            sleep 2
          done
          if [ "$prom_ready" != "true" ]; then
            echo "❌ Prometheus n'a pas répondu dans le délai imparti."
            docker compose logs prometheus
            exit 1
          fi

          echo "Attente de la disponibilité de Grafana sur http://localhost:3000/api/health..."
          graf_ready=false
          for i in {1..20}; do
            if curl -sf "http://localhost:3000/api/health" > /dev/null 2>&1; then
              echo "✔ Grafana opérationnel !"
              graf_ready=true
              break
            fi
            sleep 2
          done
          if [ "$graf_ready" != "true" ]; then
            echo "❌ Grafana n'a pas répondu dans le délai imparti."
            docker compose logs grafana
            exit 1
          fi

      - name: Verify Janus Web Demonstrator availability
        run: |
          echo "Attente de la disponibilité du frontend Janus Web sur http://localhost:4280..."
          web_ready=false
          for i in {1..20}; do
            if curl -sf "http://localhost:4280" > /dev/null 2>&1; then
              echo "✔ Frontend Janus Web opérationnel !"
              web_ready=true
              break
            fi
            sleep 2
          done
          if [ "$web_ready" != "true" ]; then
            echo "❌ Le frontend Janus Web n'a pas répondu dans le délai imparti."
            docker compose logs web
            exit 1
          fi

      - name: Setup .NET 10 SDK for integration tests
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET 10 Integration & Concurrency Tests (Janus.Api.Tests)
        run: |
          dotnet test tests/Janus.Api.Tests/Janus.Api.Tests.csproj --configuration Release --logger "console;verbosity=detailed"

      - name: Run 31 Integration Tests (test_api.py)
        run: |
          python3 tests/test_api.py

      - name: Run End-to-End Demo Scenario (demo_scenario.py)
        run: |
          python3 simulator/demo_scenario.py

      - name: Verify Metrics Scraped by Prometheus
        run: |
          python3 tests/verify_metrics.py

      - name: Capture container logs on failure
        if: failure()
        run: |
          echo "=== Logs du conteneur API et PostgreSQL ==="
          docker compose logs

      - name: Teardown isolated containers and volumes
        if: always()
        run: |
          docker compose down -v

  security-scan:
    name: 4. Container Security Scan (Trivy DevSecOps)
    runs-on: ubuntu-latest
    needs: integration-tests

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Docker image from Dockerfile
        run: |
          docker build -t janus-api:${{ github.sha }} src/Janus.Api

      # Étape 1 : Génération du rapport SARIF pour audit complet (sévérités HIGH et CRITICAL).
      # ignore-unfixed: true filtre les vulnérabilités amont sans correctif éditeur disponible.
      - name: Generate Trivy SARIF report (HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'janus-api:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # Étape 2 : Publication du rapport SARIF vers l'onglet GitHub Security (Code scanning alerts).
      # Note : continue-on-error: true est requis si le dépôt est privé sans licence GitHub Advanced Security (GHAS).
      # Sur un dépôt public ou avec licence GHAS, le rapport est publié sans interruption.
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container-security'

      # Étape 3 : Affichage du résumé tabulaire lisible dans la console de CI pour les sévérités HIGH et CRITICAL.
      - name: Display Trivy audit summary in CI logs (HIGH & CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'janus-api:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

      # Étape 4 : Contrôle bloquant de sécurité (Quality Gate).
      # Politique de blocage : Seules les vulnérabilités CRITICAL avec un correctif disponible (actionnables)
      # provoquent l'échec du job (exit-code: 1). Les vulnérabilités HIGH sont signalées et auditées sans bloquer la pipeline.
      - name: Enforce Trivy security gate (Fail ONLY on actionable CRITICAL vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'janus-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'

  sonarcloud:
    name: 5. SonarCloud Code Analysis & Quality Gate
    runs-on: ubuntu-latest
    needs: [build-dotnet, test-and-build-frontend]

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: janus_ci_db
          POSTGRES_USER: janus_ci_user
          POSTGRES_PASSWORD: ci_test_password_secure_99
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: janus_ci_db
      POSTGRES_USER: janus_ci_user
      POSTGRES_PASSWORD: ci_test_password_secure_99
      ConnectionStrings__JanusDb: "Host=localhost;Port=5433;Database=janus_ci_db;Username=janus_ci_user;Password=ci_test_password_secure_99"
      TERMINAL_DEMO_TOKEN: ci_terminal_token_secure_99
      TERMINAL_02_TOKEN: ci_terminal_02_token_secure_99
      ADMIN_DEMO_TOKEN: ci_admin_token_secure_99
      FARE_AMOUNT_MILLIMES: 1500
      ANTIPASSBACK_ENABLED: "true"
      ANTIPASSBACK_WINDOW_SECONDS: "30"

    steps:
      - name: Checkout repository (full git history for SonarCloud)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check SonarCloud Token availability
        id: check_token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning title=SonarCloud::SONAR_TOKEN secret is not configured in GitHub repository secrets. Skipping SonarCloud analysis."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Java 21 (required by SonarScanner)
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET 10 SDK
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Download frontend code coverage artifact (LCOV)
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: frontend-coverage
          path: src/Janus.Web/coverage/janus.web

      - name: Install SonarScanner for .NET
        if: steps.check_token.outputs.has_token == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis session
        if: steps.check_token.outputs.has_token == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"nacefmoula_janus-rfid-platform" \
            /o:"nacefmoula-1" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="coverage/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="src/Janus.Web/coverage/janus.web/lcov.info" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/.angular/**,**/bin/**,**/obj/**" \
            /d:sonar.coverage.exclusions="tests/**,**/*.spec.ts,**/Program.cs,**/Migrations/**" \
            /d:sonar.qualitygate.wait=true

      - name: Restore NuGet dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: dotnet restore

      - name: Compile solution under Sonar analysis
        if: steps.check_token.outputs.has_token == 'true'
        run: dotnet build --configuration Release --no-restore

      - name: Execute .NET tests with OpenCover collection
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          dotnet test tests/Janus.Api.Tests/Janus.Api.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./coverage

      - name: End SonarCloud analysis session and evaluate Quality Gate
        if: steps.check_token.outputs.has_token == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
