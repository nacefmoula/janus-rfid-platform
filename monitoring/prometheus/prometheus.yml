global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'janus-api'
    metrics_path: '/metrics'
    scrape_interval: 2s
    bearer_token_file: '/run/secrets/metrics_token'
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'janus-rfid'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
